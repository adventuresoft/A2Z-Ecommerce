appId: com.atozecommerce.app.staging
name: "01 - Auth Phone-First Login & OTP Verification"
env:
  TEST_PHONE: "01707819647"
  TEST_PASSWORD: "Password123!"
---
- launchApp:
    clearState: true
- tapOn:
    id: "tabs.account"
- tapOn:
    id: "account.signInButton"
- assertVisible:
    id: "auth.phoneInput"
- tapOn:
    id: "auth.phoneInput"
- inputText: "${TEST_PHONE}"
- tapOn:
    id: "auth.phoneContinueButton"
- runFlow:
    when:
      visible:
        id: "auth.phonePasswordInput"
    commands:
      - tapOn:
          id: "auth.phonePasswordInput"
      - inputText: "${TEST_PASSWORD}"
      - tapOn:
          id: "auth.phoneLoginButton"
- assertVisible:
    id: "account.ordersItem"
