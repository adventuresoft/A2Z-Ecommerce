appId: com.atozecommerce.app.staging
name: "02 - Browse, Search, Faceted Filter & PDP Variant Selection"
---
- launchApp
- assertVisible:
    id: "home.screen"
- tapOn:
    id: "home.searchBar"
- assertVisible:
    id: "search.input"
- tapOn:
    id: "search.input"
- inputText: "phone"
- pressKey: Enter
- assertVisible:
    id: "catalog.openFiltersChip"
- tapOn:
    id: "catalog.openFiltersChip"
- tapOn:
    id: "filters.applyButton"
- tapOn:
    index: 0
    id: "catalog.productCard.*"
- assertVisible:
    id: "pdp.addToCartButton"
- tapOn:
    id: "pdp.addToCartButton"
- tapOn:
    id: "tabs.cart"
- assertVisible:
    id: "cart.checkoutButton"
